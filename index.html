const ROWS = DB.rows;
// columns: 0=ลำดับ 1=ชื่อ-นามสกุล 2=รหัสนักศึกษา 3=ระดับการศึกษา 4=ระดับชั้นปี 5=สาขาวิชา/หลักสูตร 6=ผลการเรียน 7=สถานะ
const SEQ=0, NAME=1, SID=2, LEVEL=3, YEAR=4, PROGRAM=5, GPA=6, STATUS=7;

const q = document.getElementById('q');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');

function render(list, query){
  if(!query){
    resultsEl.innerHTML = '<div class="state">พิมพ์คำค้นหาด้านบนเพื่อเริ่มค้นหา</div>';
    countEl.textContent = '';
    return;
  }
  if(query.length < 2){
    resultsEl.innerHTML = '<div class="state">พิมพ์อย่างน้อย 2 ตัวอักษร</div>';
    countEl.textContent = '';
    return;
  }
  if(!list.length){
    resultsEl.innerHTML = '<div class="state">ไม่พบรายชื่อที่ตรงกับคำค้นหา</div>';
    countEl.textContent = '';
    return;
  }
  resultsEl.innerHTML = list.map(row => `
    <div class="card">
      <div class="num">${row[SEQ]}</div>
      <div>
        <div class="name">${row[NAME]}</div>
        <div class="meta">
          รหัสนักศึกษา ${row[SID]} · ${row[LEVEL]} ${row[YEAR]}<br>
          ${row[PROGRAM]}<br>
          เกรดเฉลี่ย ${row[GPA]} · ${row[STATUS]}
        </div>
      </div>
    </div>
  `).join('');
  countEl.textContent = `พบ ${list.length} รายการ`;
}

function search(query){
  const s = query.trim().toLowerCase();
  if(!s) return [];
  return ROWS.filter(row =>
    row[NAME].toLowerCase().includes(s) ||
    row[SID].includes(s)
  ).slice(0, 50);
}

q.addEventListener('input', () => {
  const query = q.value;
  render(search(query), query.trim());
});

render([], '');
</script>
